spring:
  application:
    name: knowledge-platform
  profiles:
    active: dev  # 激活 dev 环境
  security:
    basic:
      enabled: false

server:
  port: 8888  # 后端服务端口
  servlet:
    context-path: /api

logging:
  level:
    com.knowledgeplatform: debug
    org.springframework.security: debug

# 系统监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,threaddump,heapdump
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
      enabled: true
    tags:
      application: ${spring.application.name}